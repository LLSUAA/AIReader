<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIReader - 深度认知伴侣</title>
  <link rel="stylesheet" href="reader.css">
</head>
<body>

  <div class="app">

    <!-- ====== 左侧：主阅读区 ====== -->
    <main class="reader-pane" id="reader-pane">

      <!-- 加载后的阅读渲染区 -->
      <div class="viewer-container" id="viewer-container">
        <div class="topbar">
          <span class="topbar-title" id="book-title">未命名书籍</span>
          <div class="topbar-actions">
            <button class="topbar-btn" id="btn-home" title="返回大厅">🏠</button>
            <button class="topbar-btn" id="btn-lang" title="切换 AI 回复语言">中</button>
            <button class="topbar-btn" id="btn-theme" title="切换深浅色主题">🌓</button>
            <button class="topbar-btn" id="btn-close" title="关闭当前书籍">&times;</button>
          </div>
        </div>
        <div id="viewer" class="viewer"></div>
        <div class="bottombar">
          <button class="nav-btn" id="btn-prev" title="上一页 (←)">← 上一页</button>
          <span class="page-indicator" id="page-indicator">—</span>
          <button class="nav-btn" id="btn-next" title="下一页 (→)">下一页 →</button>
        </div>
      </div>

    </main>

    <!-- ====== 右侧：AI 心智面板 ====== -->
    <aside class="ai-pane" id="ai-pane">
      <div class="ai-header">
        <span class="ai-header-title">AI 陪读面板</span>
      </div>

      <div class="ai-actions">
        <button class="ai-btn" data-action="history">
          <svg class="ai-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          前文复盘回顾
        </button>
        <button class="ai-btn" data-action="chapter">
          <svg class="ai-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
          </svg>
          提炼本章骨架
        </button>
        <button class="ai-btn" data-action="explain">
          <svg class="ai-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
          </svg>
          解释选中段落
        </button>
        <button class="ai-btn" data-action="quiz">
          <svg class="ai-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3M12 17h.01"/>
          </svg>
          沙盘推演测验
        </button>
      </div>

      <div class="chat-container" id="chat-container">
        <div class="chat-placeholder">
          <svg class="chat-placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
          </svg>
          <p>AI 陪读伴侣</p>
          <p class="chat-placeholder-hint">点击上方按钮或输入问题开始对话</p>
        </div>
      </div>

      <div class="chat-input-area">
        <textarea id="chat-input" placeholder="输入你的推演或向导师提问..." rows="2"></textarea>
        <button id="btn-send">发送</button>
      </div>
    </aside>

  </div>

  <script src="jszip.min.js"></script>
  <script src="epub.min.js"></script>
  
  <script src="marked.min.js"></script>
  <script src="skills/db.js"></script>
  <script src="skills/api.js"></script>
  <script src="skills/skills.js"></script>
  
  <script src="skills/reader.js"></script>
</body>
</html>
